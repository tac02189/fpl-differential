name = "fpl-proxy"
main = "fpl-proxy.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "SUBS"
id = "1636d1cf411f4eacb586c1bd200d278e"

# Per-IP throttle for /subscribe. 5/minute is far above anything a person does — they
# toggle alerts, they do not loop — and far below what it takes to exhaust the KV read
# quota. namespace_id is a local identifier for this limiter, not an account resource.
[[ratelimits]]
name = "SUBSCRIBE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
