name: notifications

# never run two instances at once — overlapping runs double-send reminders
# and clobber each other's dedup state
concurrency:
  group: notify
  cancel-in-progress: false

on:
  schedule:
    # Twice an hour, deliberately off :00 and :30. GitHub's docs say scheduled runs are
    # delayed under high load, that the start of every hour is a high-load time, that
    # some queued runs may then be dropped, and that another minute lowers the chance of
    # delay. :30 is where every */30, */15, */10 and */5 schedule fires too; :13 and :43
    # are clear of all of them. Whether that also means fewer dropped runs is what this
    # is testing. Baseline on */30, scheduled runs 2026-10-04 to 11-04: 5.05 a day of a
    # possible 48, median gap 4.75h, p90 7.07h, max 9.63h, which is what the reminder
    # windows in scripts/notify.mjs are sized for. Still 48 ticks a day, so the worker's
    # KV budget is unchanged.
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test push to all subscribers
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # v7 for the same reason as in test.yml, where the reasoning is written out.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A registry ECONNRESET failed the 2026-10-23 20:00Z run here, emailing a red
      # build for a tick that had nothing to send. notify.mjs already retries its /subs
      # and /state reads for that reason (getJsonRetry); this retries the whole install,
      # which covers more ground than npm's own per-request retries — those are not
      # guaranteed to cover a reset that arrives mid-tarball.
      # Actions runs this block as `bash -e`, so the install goes in an `if` condition:
      # a bare failing command would abort the step and the loop would never retry.
      # A recovered attempt still leaves a warning annotation, so a degrading registry
      # stays visible instead of hiding behind a green run.
      #
      # Pinned to 3.x since 2026-11-06. The install named no version, so the first run
      # after web-push 4.0.0 was published (11:44Z that day) picked it up. 4.0.0 is
      # ESM-only with no default export, so `import webpush from 'web-push'` in notify.mjs
      # threw at load and the 17:58Z run failed before reading anything.
      # 4.x is not taken on purpose. It was hours old, it rewrites the library as ESM
      # classes, and the one fix in its commit log (#999) refreshed only its own repo's
      # lockfile. An isolated npm dry run that day resolved the same jws 4.0.1, jwa 2.0.1
      # and bn.js 4.12.5 under both; they differed in http_ece (1.2.0 vs 1.2.1, whose only
      # release note is a test-runner switch), the proxy agent (7 vs 9) and minimist, none
      # with a GitHub advisory at those versions. This project's lockfile pins only debug
      # and ms from that tree, at the same versions. Moving to 4.x means changing that
      # import and confirming a test push reaches a phone, not just bumping this line.
      # The version is echoed because npm prints only a package count, and it read
      # "added 383 packages" for both 3.6.7 and 4.0.0.
      - name: Install web-push (retry transient registry failures)
        timeout-minutes: 5
        run: |
          for i in 1 2 3; do
            if npm install --no-save --no-audit --no-fund 'web-push@^3.6.7'; then
              echo "web-push $(node -p "require('./node_modules/web-push/package.json').version")"
              if [ "$i" -gt 1 ]; then
                echo "::warning::npm install recovered on attempt $i/3"
              fi
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              echo "npm install failed (attempt $i/3) — retrying in $((i * 10))s"
              sleep $((i * 10))
            fi
          done
          echo "npm install failed after 3 attempts; see the errors above."
          exit 1
      - run: node scripts/notify.mjs
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SUBS_SECRET: ${{ secrets.SUBS_SECRET }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ inputs.test }}
