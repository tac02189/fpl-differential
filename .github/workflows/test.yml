name: tests

# The suites are pure Node — no install, no network, no secrets. That is why this
# can run on every push without the registry-retry dance notify.yml needs: there is
# nothing to install, so there is nothing to fail transiently.
on:
  push:
    paths:
      - 'worker/**'
      - 'src/lib/push.js'        # msgmap.test.mjs reads this against the worker's 4xx strings
      - 'scripts/notify.mjs'
      - 'scripts/test-notify-plan.mjs'
      - 'test/**'
      - 'package.json'          # holds the `test` script this job runs
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The run takes ~4s. The runner also times each suite out at 60s, so this is
    # the outer net for a failure that stops the runner itself from finishing.
    timeout-minutes: 5
    steps:
      # v7, not v4: the v4 actions declare Node 20, which GitHub now forces onto
      # Node 24 and annotates every run about. Both were bumped 2026-11-03. The one
      # behaviour change in the majors between is setup-node v5's automatic caching,
      # which engages only on a `packageManager` field in package.json — this project
      # has none, and `package-manager-cache: false` is the off switch if it ever does.
      # Major tags float, so these pick up patches without another edit here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
